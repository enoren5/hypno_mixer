{% extends 'base.html' %}

{% block content %}

<div class=body>
        
    {% if inductions  %}
        <h1 class="title">{{inductions.title}}</h1>
        <h3><em>Inductions</em></h3>
        <div class="author">Author: {{inductions.author}}</div>
        <div class="publication-date">Published: {{inductions.publication_date|date:"l j F Y"}}</div>
        <div class="detail">{{inductions.body|safe}}</div> <!-- end detail class -->
    {% endif %}
</div> <!-- end body -->
{% endblock %}
